[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-analysis-engine"
version = "0.1.0"
description = "Market Intelligence Engine: Asynchronous Financial Sentiment and Market Data ELT Pipeline"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Deep Research FinTech Team" }
]
dependencies = [
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "polars>=0.20.0",
    "pyarrow>=14.0.0",
    "duckdb>=0.10.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0"
]

[project.optional-dependencies]
ml = [
    "transformers>=4.38.0",
    "torch>=2.0.0"
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
