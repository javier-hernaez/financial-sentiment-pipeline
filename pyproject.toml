[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-analysis-engine"
dynamic = ["version"]
description = "Market Intelligence Engine: asynchronous financial sentiment and market data ELT pipeline"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Javier Hernáez" }
]
# Compatible ranges. The exact versions that were tested are in requirements.lock.
dependencies = [
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.28.0",
    "polars>=1.21.0",
    "pyarrow>=14.0.0",
    "duckdb>=1.5.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "defusedxml>=0.7.1"
]

[project.scripts]
market-pipeline = "src.main:main"

[project.optional-dependencies]
ml = [
    "transformers>=4.38.0",
    "torch>=2.0.0"
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pip-audit>=2.7.0",
    "types-defusedxml>=0.7.0"
]

[tool.setuptools.dynamic]
version = { attr = "src.__version__" }

# The code lives in the "src" package itself (imports are "src.*"), so it must not be treated as a src-layout
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "network: tests that hit live external APIs (deselect with -m \"not network\")",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["venv", "frontend", "build", "scratch", "internal"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I",  # pycodestyle, pyflakes, isort
    "UP",                # modern syntax
    "B",                 # likely bugs
    "C4",                # comprehensions
    "SIM",               # simplifications
    "ASYNC",             # blocking calls in async code
    "S",                 # security
    "RUF",               # ruff's own checks
    "PIE", "RET", "T20", # misc cleanups, no stray prints
]
ignore = [
    "E501",    # line length is the formatter's job
    "B008",    # FastAPI's Depends() in defaults is the documented pattern
    "RUF001",  # the word lists and tests contain non-ASCII on purpose
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "RUF012", "RUF029", "ASYNC"]
"benchmarks/*" = ["S", "T20"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Optional heavy dependencies, imported only where the model is loaded
module = ["torch.*", "transformers.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
